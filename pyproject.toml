[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofgarden"
version = "0.2.0"
description = "Educational laboratory for formal methods: logic, state machines, bounded model checking, Hoare logic."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Custom EULA — see EULA.md" }
authors = [{ name = "Anika Mukherjee (Dev2Creator)", email = "cuteypieanika@gmail.com" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["proofgarden*"]
